
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ChatGPT to PDF</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h2>✦ ChatGPT PDF</h2>
        <span>QUESTION & ANSWER EXPORTER</span>
    </header>

    <section class="hero">

        <div class="tag">PREVIEW BEFORE PDF</div>

        <h1>
            Convert your conversation
            <span>into PDF.</span>
        </h1>

        <p>
            Paste your ChatGPT shared link.
            Preview all questions and answers before downloading.
        </p>

        <div class="input-card">

            <label>CHATGPT SHARE LINK</label>

            <input
                type="url"
                id="shareUrl"
                placeholder="https://chatgpt.com/share/..."
            >

            <div class="buttons">

                <button
                    id="previewBtn"
                    onclick="previewConversation()">

                    Preview Conversation

                </button>

                <button
                    id="pdfBtn"
                    onclick="downloadPDF()"
                    disabled>

                    Download PDF

                </button>

            </div>

            <div id="status">
                Paste your public ChatGPT link.
            </div>

        </div>

    </section>

    <!-- PREVIEW SECTION -->

    <section id="previewSection" hidden>

        <div class="preview-header">

            <div>
                <small>CONTENT CHECK</small>

                <h2 id="conversationTitle">
                    Conversation Preview
                </h2>
            </div>

            <div id="counts"></div>

        </div>

        <div id="warning"></div>

        <div id="messages"></div>

    </section>

    <footer>
        ChatGPT Conversation PDF Generator
    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
